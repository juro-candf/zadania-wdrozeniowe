apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zw-app
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: rate-limiting,cors,request-size-limiting
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.backend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.port }}

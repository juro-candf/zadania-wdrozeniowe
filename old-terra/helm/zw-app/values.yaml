backend:
  image:
    repository: ghcr.io/juro-candf/zadania-wdrozeniowe-backend
    tag: latest
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

frontend:
  image:
    repository: ghcr.io/juro-candf/zadania-wdrozeniowe-frontend
    tag: latest
  replicas: 1
  port: 8501
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  image: postgres:16
  # Name of a Secret (created outside this chart, e.g. by Terraform) with
  # keys POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB.
  existingSecret: postgres-credentials
  port: 5432
  storage: 1Gi
  storageClassName: default
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  className: kong
  # Leave empty to match any Host (path-based routing only).
  host: ""

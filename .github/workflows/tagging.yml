name: Auto Tagging
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
    tag:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
            
            - name: Determine next version
              id: bump
              env:
                COMMIT_MSG: ${{ github.event.head_commit.message }}
              run: |
                latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
                latest_tag=${latest_tag:-v0.0.0}
                version=${latest_tag#v}
                IFS='.' read -r major minor patch <<< "$version"
                
                if [[ "$COMMIT_MSG" =~ ^feature/ ]]; then
                    major=$((major + 1)); minor=0; patch=0
                elif [[ "$COMMIT_MSG" =~ ^fix/ ]]; then
                    minor=$((minor + 1)); patch=0
                elif [[ "$COMMIT_MSG" =~ ^hotfix/ ]]; then
                    patch=$((patch + 1))
                else
                    echo "No matching prefix (feature/, fix/, hotfix/) found in commit message. No tag will be created."
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                    exit 0
                fi

                new_version="v${major}.${minor}.${patch}"
                echo "version=$new_version" >> "$GITHUB_OUTPUT"
                echo "skip=false" >> "$GITHUB_OUTPUT"


            - name: Create Tag
              if: steps.bump.outputs.skip == 'false'
              run: |
                git config --local user.email "action@github.com"
                git config --local user.name "GitHub Action"
                git tag -a "${{steps.bump.outputs.version}}" -m "Release ${{steps.bump.outputs.version}}"
                git push origin "${{steps.bump.outputs.version}}"
            - name: Create Release
              if: steps.bump.outputs.skip == 'false'
              uses: softprops/action-gh-release@v3
              with:
                tag_name: '${{steps.bump.outputs.version}}'
                name: 'Release ${{steps.bump.outputs.version}}'
                generate_release_notes: true
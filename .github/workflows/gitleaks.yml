name: Gitleaks

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    scan:
        name: Gitleaks Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
            
            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
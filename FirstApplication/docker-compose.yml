services:
  backend:
    image: ghcr.io/juro-candf/zadania-wdrozeniowe-backend:latest
    expose:
      - "8000"
    volumes:
      - firstapplicationdata:/app/data
    environment:
      - DATABASE_PATH=${DATABASE_PATH}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  frontend:
    image: ghcr.io/juro-candf/zadania-wdrozeniowe-frontend:latest
    expose:
      - "8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  firstapplicationdata:
name: Auto Tests

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]
    workflow_dispatch:

jobs:
    tests:
        name: Auto Tests (Python 3.13)
        runs-on: ubuntu-latest
        services:
          postgres:
            image: postgres:16
            env:
              POSTGRES_USER: testuser
              POSTGRES_PASSWORD: testpass
              POSTGRES_DB: test_coolpeople
            ports:
              - 5432:5432
            options: >-
              --health-cmd="pg_isready -U testuser"
              --health-interval=5s
              --health-timeout=5s
              --health-retries=5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python 3.13
              uses: actions/setup-python@v7
              with:
                python-version: "3.13"
                cache: pip

            - name: Install dependencies
              working-directory: backend
              run: |
                pip install -r requirements.txt

            - name: Run tests
              working-directory: backend
              env:
                POSTGRES_HOST: localhost
                POSTGRES_PORT: "5432"
                POSTGRES_DB: test_coolpeople
                POSTGRES_USER: testuser
                POSTGRES_PASSWORD: testpass
              run: |
                pytest test_main.py -v --tb=short --junit-xml=pytest_results.xml

            - name: Test results
              if: always()
              run: |
                echo "Test results:"
                cat backend/pytest_results.xml